apiVersion: apps/v1
kind: Deployment
metadata:
  name: reconagent
  labels:
    app: reconagent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: reconagent
  template:
    metadata:
      labels:
        app: reconagent
    spec:
      containers:
        - name: reconagent
          image: reconagent:latest
          ports:
            - containerPort: 3000
          env:
            - name: DATABASE_URL
              value: file:/app/data/dev.db
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: reconagent
spec:
  selector:
    app: reconagent
  ports:
    - name: http
      port: 80
      targetPort: 3000